name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check -p moddotplot-wasm --target wasm32-unknown-unknown

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --target wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - run: npm ci
        working-directory: web
      - run: npm run build:release
        working-directory: web
      - run: git diff --exit-code -- docs/CURRENT_PARAMETERS.md SBOM.cdx.json THIRD_PARTY_LICENSES.txt
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
